<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overall Statistics</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>True Colors Personality Quiz</h1>
    </header>

    <main class="statistics-main">
        <section class="statistics-heading">
            <h2>Overall Statistics</h2>
            <p>
                See how completed quiz results are distributed across the four personality categories.
            </p>
        </section>

        <section class="statistics-grid">
            <article class="stat-card blue-stat">
                <h3>Blue</h3>
                <p class="stat-percentage">41%</p>
            </article>

            <article class="stat-card green-stat">
                <h3>Green</h3>
                <p class="stat-percentage">32%</p>
            </article>

            <article class="stat-card yellow-stat">
                <h3>Gold</h3>
                <p class="stat-percentage">17%</p>
            </article>

            <article class="stat-card orange-stat">
                <h3>Orange</h3>
                <p class="stat-percentage">10%</p>
            </article>
        </section>

        <p class="statistics-note">
            These values are mock statistics for the static project mockup.
        </p>
    </main>

    <footer>
        Personality Quiz Project
    </footer>
</body>
</html>
