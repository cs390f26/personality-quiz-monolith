<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>True Colors Personality Quiz</h1>
    </header>

    <main class="results-main">
        <section class="results-card">
            <div class="result-badge">Your Result</div>

            <h2>You are a <span class="result-type color-blue">Blue</span>!</h2>

            <div class="result-panel">
                <p class="result-label">Personality Type</p>
                <h3 class="personality-result color-blue">Blue</h3>
                <p class="result-description">
                    You are thoughtful, empathetic, and deeply connected to the people around you.
                    You value meaningful relationships and are often the person others turn to for support.
                </p>
            </div>

            <div class="result-actions">
                <button type="button" class="stats-button">View Overall Statistics</button>
                <button type="button" class="secondary-button">Retake Quiz</button>
            </div>
        </section>
    </main>

    <footer>
        Personality Quiz Project
    </footer>
</body>
</html>
